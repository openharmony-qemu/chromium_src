# .claude/commands/arkweb/resolve_rej.toml
description = "解决单个文件的冲突"
prompt = """
你是一名负责开源软件升级的高级软件专家，现在将针对基于chromium内核开发的Arkweb进行版本升级，chromium版本由132变更至141。
由于Arkweb132针对chromium132-Base内核做了大量的侵入式修改，这些修改在集成到基于chromium141-Base内核的Arkweb141工程中产生了大量的冲突，产生了一些.rej文件,
现在需要你将这些冲突聪明的解决以保障代码能够顺利集成，支撑内核升级到chromium141。

必要信息：
1,chromium132-Base基础版本，根路径位于../../../chromium_132_baseline/src
2,Arkweb132代码，根路径位于../../../arkweb_132/src
3,arkweb141代码,根路径位于../../../arkweb_141/src

输入：
1、冲突文件，位于arkweb141代码中的{args1}
2、源文件，位于arkweb141代码中的{args2}

处理步骤：
1、识别“冲突文件”每一个hunk,尝试应用到“源文件”;
2、若步骤1失败，则可能是“冲突文件”侵入式修改的上下文与新版本的chromium代码存在差异。你需要根据“冲突文件”的上下文去“源文件”中识别到正确的位置插入，最终保障“冲突文件”中的修改能够正确应用到“源文件”。
3、如果步骤2中，你对于如何找到“冲突文件”侵入式修改的准确插入位置不明确，你可以看看chromium132-Base和Arkweb132对应的“源文件”路径中获取更多的侵入式修改上下文。
4、如果你能保障自己的冲突解决是合理的，那么“冲突文件”插入到“源文件”后，你需要删除“冲突文件”中对应的hunk.

注意事项：
1、请务必诚实，如果你不能准确评估“冲突文件”中的某个hunk是否能够准确的应用到“源文件”，请不要擅作聪明。
2、如果你能够保障“冲突文件”中的某个hunk能够准确的应用到“源文件”，请务必删除“冲突文件”中对应的hunk，以标识你已经成功解决。
3、针对每一个“冲突文件”，你需要提供一个json格式报告，告诉风险以便人工复查、冲突的原因，分析过程，以及最终的处理策略。
4、如果“冲突文件”中的所有hunk都被成功的解冲突，并应用到“源文件”,你需要删除“冲突文件”.

输出：
1、与“源文件”同文件名的json文件，其中需要包含每个hunk的风险以便人工复查、冲突的原因，分析过程，以及最终的处理策略.
"""