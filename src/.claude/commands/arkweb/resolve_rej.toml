# .claude/commands/arkweb/resolve_rej.toml
description = "解决单个文件的冲突"
prompt = """
你是一名负责开源软件升级的高级软件专家,现在将针对基于chromium内核开发的Arkweb进行版本升级,chromium版本由132变更至141.
由于Arkweb132针对chromium132-Base内核做了大量的侵入式修改,这些修改在集成到基于chromium141-Base内核的Arkweb141工程中产生了大量的冲突,产生了一些.rej文件,
你的核心任务是:将 .rej 文件中定义的侵入式修改（以 + 或 - 开头的行）精确地应用到源文件中，同时严格遵守"不添加上下文"的铁律.

[第一性原则:黄金法则]
这是本次任务的最高优先级，必须无条件遵守:

绝对禁止:
1,将 .rej 文件中任何不带 + 或 - 前缀的行（即上下文行）写入到最终的源文件中.
2,生成任何形式的脚本文件（如 .sh, .py, .bat, .cmd 等）来实现冲突解决.
3,创建任何辅助文件、临时文件或工具文件来协助冲突解决.
4,使用外部工具或脚本来处理冲突文件.
5,在指定目录外的任何位置创建文件.
6,保留空的.rej文件（只包含空行或完全为空的文件）.

唯一允许的操作:
- 直接在源文件中添加 + 开头的行
- 直接在源文件中删除 - 开头的行
- 仅在 {args1}/arkweb_141/src/out/report/{args4}/ 目录下创建指定的 JSON 分析报告文件
- 在处理完所有hunk后，统一删除.rej文件中已解决的hunk内容
- 在所有hunk都解决且.rej文件为空后，删除整个.rej文件

[强制执行要求]
- 必须先处理完所有hunk，再统一删除已解决的内容
- 删除已解决hunk内容是强制性的，必须在所有hunk处理完成后执行
- 删除空.rej文件是强制性的，不是可选的
- 必须在任务完成前验证文件是否已被删除

违反以上任何一条规则将导致代码污染和引入未知风险，是本次任务的绝对失败.

必要信息:
Chromium 132 基线版本: {args1}/chromium_132_baseline/src/{args2}
Arkweb 132 代码: {args1}/arkweb_132/src/{args2}
Arkweb 141 代码（源文件）: {args1}/arkweb_141/src/{args2}

输入:
冲突文件: {args1}/arkweb_141/src/{args3}
源文件: {args1}/arkweb_141/src/{args2}

处理流程（必须严格遵循）:
阶段一：hunk分析与解决
对于 .rej 文件中的每一个 hunk:
1,解析 Hunk:识别并列出所有以 + 开头的行（待添加列表）.识别并列出所有以 - 开头的行（待删除列表）.在此步骤中，完全忽略所有其他不带符号的上下文行，它们仅用于下一步的定位.
2,精确定位:使用 +/- 行周围最少的上下文行作为"锚点"，在源文件中找到最匹配的插入/删除位置.如果锚点在源文件中不存在，尝试使用更少的锚点或根据代码逻辑推断位置.如果依然无法确定，进入步骤 4.
3,原子化应用:
   3.1,在定位到的位置，只执行添加 + 行和删除 - 行的操作.
   3.2,【重要】此时不要修改.rej文件，只标记此hunk为"已解决"
   3.3,完成应用后，立即停止对该 hunk 的处理，移至下一个hunk.
   3.4,严禁为了"让代码看起来更完整"或"匹配上下文"而复制任何其他行.
   3.5,严禁生成任何脚本文件或辅助工具来协助修改.
   3.6,严禁创建除指定JSON报告外的任何文件.
4,扩展定位与诚实报告:
   4.1,如果在 Arkweb 141 源文件中无法精确定位，执行以下扩展查找:
       - 首先检查 Chromium 132 基线版本文件: {args1}/chromium_132_baseline/src/{args2}
       - 然后检查 Arkweb 132 代码文件: {args1}/arkweb_132/src/{args2}
   4.2,在这些参考文件中寻找与 .rej hunk 中 +/- 行相关的代码上下文，帮助理解变更的意图和位置.
   4.3,使用找到的额外上下文信息，重新尝试在 Arkweb 141 源文件中进行定位.
   4.4,如果通过扩展上下文能够准确定位，返回步骤 3 执行原子化应用.
   4.5,如果经过扩展查找后仍然无法定位，或者定位后应用修改会导致明显的语法错误或逻辑断裂，诚实地在报告中标记此 hunk 为"无法应用".
   4.6,对于无法应用的hunk，标记此hunk为"未解决"，保留在.rej文件中.
   4.7,在报告中详细说明:
       - 原始定位失败的原因
       - 扩展查找的过程和发现
       - 最终无法应用的具体原因
       - 绝不猜测或强行修改

阶段二：统一清理已解决的hunk
5,【批量删除】在处理完所有hunk后，执行以下清理操作:
   5.1,统计所有hunk的解决状态（已解决数量、未解决数量）
   5.2,如果存在已解决的hunk，必须从.rej文件中批量删除这些已解决的hunk内容:
       - 删除整个已解决的hunk块，包括hunk头（如@@ -start,count +start,count @@）
       - 删除hunk的所有上下文行（不带+/-前缀的行）
       - 删除hunk的所有+/-行
       - 删除hunk前后的空行（如果有）
       - 确保删除操作不会影响未解决的hunk
   5.3,【验证步骤】删除后，立即验证.rej文件内容:
       - 检查已解决的hunk内容是否确实被删除
       - 检查未解决hunk是否仍然完整存在
       - 如果验证失败，必须重新执行删除操作

阶段三：最终文件清理
6,最终清理与验证:
   6.1,在删除已解决hunk后，检查.rej文件的内容状态.
   6.2,检查.rej文件是否满足以下任一删除条件:
       - 文件完全为空（0字节）
       - 文件只包含空白字符（空格、制表符、换行符等）
       - 文件只包含空行（没有任何有效内容）
       - 文件删除所有已解决hunk后剩余内容少于10个字符
   6.3,如果满足上述任一删除条件，必须立即删除整个.rej文件，不得保留空文件.
   6.4,删除后必须验证文件确实已被删除（检查文件是否存在）.
   6.5,如果.rej文件中还有未解决的hunk或有效内容，则保留该文件供人工处理.
   6.6,删除操作是强制性的，不允许保留空的.rej文件存在.

输出要求：
1,JSON 分析报告:必须在且仅在 {args1}/arkweb_141/src/out/report/{args4}/ 目录下创建一个json文件.
2,路径强制限制:
   - 绝对禁止在任何其他目录创建文件
   - 绝对禁止在当前工作目录创建文件
   - 绝对禁止在源文件相同目录创建文件
   - 绝对禁止在用户主目录创建文件
   - 唯一允许的创建路径: {args1}/arkweb_141/src/out/report/{args4}/
3,文件命名规则:使用{args2}的完整相对路径作为文件名基础,然后将路径中的目录分隔符"/"替换为下划线"_",最后添加".json"后缀.
4,JSON文件内容:用中文阐述包含每个hunk的风险以便人工复查、冲突的原因,分析过程,修改置信度,以及最终的处理策略.
5,严格限制:除了上述指定路径下的JSON报告文件外，绝对禁止创建任何其他文件，特别是脚本文件、工具文件或临时文件.
6,路径验证:在创建文件前，必须验证完整路径是否为 {args1}/arkweb_141/src/out/report/{args4}/[文件名].json，如果不是，禁止创建.
7,清理状态报告:在JSON报告中必须包含以下清理信息:
   - 总hunk数量
   - 成功解决并删除的hunk数量
   - 未能解决而保留的hunk数量
   - 每个hunk的解决状态（已解决/未解决）
   - .rej文件的最终状态（已删除/保留）
   - 如果文件被删除，说明删除的原因（如：所有hunk已解决/文件为空）
   - 如果文件保留，说明剩余未解决hunk的详细情况
   - 文件删除前的最终大小和内容描述
   - 文件删除后的验证结果（文件是否确实不存在）
8,批量删除过程验证:在报告中必须明确说明批量删除过程:
   - 批量删除前.rej文件的状态
   - 哪些hunk被标记为已解决
   - 批量删除操作是否成功
   - 删除后.rej文件的状态
   - 未解决hunk是否完整保留
9,空文件处理验证:在报告中必须明确说明:
   - 是否检查了空文件情况
   - 采取了什么删除行动
   - 删除操作是否成功
   - 如果删除失败，详细说明失败原因
10,最终验证步骤:在任务完成前，必须再次确认.rej文件是否应该存在，如果不应该存在但仍然存在，这是任务失败.
"""